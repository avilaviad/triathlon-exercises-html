<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ספריית תרגילי טריאתלון</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5f6f7b;
      --line: #d9e2e8;
      --panel: #ffffff;
      --bg: #f3f7f9;
      --accent: #0f766e;
      --accent-2: #b45309;
      --chip: #e9f3f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.45;
    }

    header {
      padding: 28px 20px 18px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 46px);
      letter-spacing: 0;
    }

    .intro {
      max-width: 820px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(180px, 1fr) auto;
      gap: 12px;
      align-items: end;
      padding: 18px 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #32424d;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font-size: 16px;
    }

    .count {
      min-height: 44px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      padding: 0 0 34px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 20px rgba(21, 32, 43, 0.06);
    }

    .card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #dce8ed;
    }

    .card-body {
      padding: 14px;
    }

    .topline {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .pill {
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--chip);
      color: #135e58;
      font-size: 12px;
      font-weight: 700;
    }

    .pill.sport {
      background: #f7ead8;
      color: var(--accent-2);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .desc {
      min-height: 46px;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    dl {
      display: grid;
      grid-template-columns: 98px 1fr;
      gap: 7px 10px;
      margin: 0 0 14px;
      font-size: 14px;
    }

    dt {
      color: #3b4a54;
      font-weight: 700;
    }

    dd {
      margin: 0;
      color: var(--muted);
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      width: 100%;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: #0b5f59;
    }

    .note {
      padding: 14px 0 28px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 620px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .count {
        justify-content: center;
      }
    }
  </style>
</head>

    </div>

    }

    function option(value, label) {
      const item = document.createElement('option');
      item.value = value;
      item.textContent = label;
      return item;
    }

    function render() {
      const selectedType = typeFilter.value;
      const selectedSport = sportFilter.value;
      const visible = exercises.filter((exercise) => {
        const matchesType = selectedType === allTypesValue || exercise.type === selectedType;
        const matchesSport = selectedSport === allSportsValue || exercise.sport === selectedSport;
        return matchesType && matchesSport;
      });

      grid.innerHTML = '';
      resultCount.textContent = `${visible.length} תרגילים`;

      visible.forEach((exercise) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <img src="${exercise.image || svgImage(exercise)}" alt="${exercise.title}">
          <div class="card-body">
            <div class="topline">
              <span class="pill">${exercise.type}</span>
              <span class="pill sport">${exercise.sport}</span>
            </div>
            <h2>${exercise.title}</h2>
            <p class="desc">${exercise.desc}</p>
            <dl>
              <dt>פעמים ביום</dt>
              <dd>${exercise.timesDay}</dd>
              <dt>סטים</dt>
              <dd>${exercise.sets}</dd>
              <dt>מתי</dt>
              <dd>${exercise.when}</dd>
            </dl>
            <a href="${exercise.youtube}" target="_blank" rel="noopener">פתח YouTube</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    types.forEach((type) => typeFilter.appendChild(option(type, type === allTypesValue ? 'הכל' : type)));
    sports.forEach((sport) => sportFilter.appendChild(option(sport, sport === allSportsValue ? 'הכל' : sport)));
    typeFilter.addEventListener('change', render);
    sportFilter.addEventListener('change', render);
    render();
  </script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ספריית תרגילי טריאתלון</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5f6f7b;
      --line: #d9e2e8;
      --panel: #ffffff;
      --bg: #f3f7f9;
      --accent: #0f766e;
      --accent-2: #b45309;
      --chip: #e9f3f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.45;
    }

    header {
      padding: 28px 20px 18px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 46px);
      letter-spacing: 0;
    }

    .intro {
      max-width: 820px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1.2fr) minmax(160px, 1fr) minmax(160px, 1fr) auto;
      gap: 12px;
      align-items: end;
      padding: 18px 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #32424d;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    select,
    input[type="search"] {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font-size: 16px;
    }

    .count {
      min-height: 44px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      padding: 0 0 34px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 20px rgba(21, 32, 43, 0.06);
    }

    .card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #dce8ed;
    }

    .card-body {
      padding: 14px;
    }

    .topline {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .pill {
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--chip);
      color: #135e58;
      font-size: 12px;
      font-weight: 700;
    }

    .pill.sport {
      background: #f7ead8;
      color: var(--accent-2);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .desc {
      min-height: 46px;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .guide-lines {
      display: grid;
      gap: 6px;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .guide-lines p {
      margin: 0;
    }

    .guide-lines strong {
      color: #3b4a54;
    }

    dl {
      display: grid;
      grid-template-columns: 98px 1fr;
      gap: 7px 10px;
      margin: 0 0 14px;
      font-size: 14px;
    }

    dt {
      color: #3b4a54;
      font-weight: 700;
    }

    dd {
      margin: 0;
      color: var(--muted);
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      width: 100%;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: #0b5f59;
    }

    .back-to-top {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.28);
      cursor: pointer;
      font-size: 26px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 160ms ease, transform 160ms ease, background 160ms ease;
    }

    .back-to-top.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .back-to-top:hover,
    .back-to-top:focus-visible {
      background: #0b5f59;
    }

    .note {
      padding: 14px 0 28px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 620px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .count {
        justify-content: center;
      }
    }
  </style>
</head>

    </div>
  </header>

      <div>

        <select id="sportFilter"></select>

      <div id="resultCount" class="count" aria-live="polite"></div>

    <section id="exerciseGrid" class="grid" aria-label="Exercise list"></section>

  </main>

          "שחייה – Forearm Extensor Stretch": {

                "helps": "עוזר לשחרור אמה עליונה ואזור שורש כף היד.",
                "source": "How to stretch your forearm extensor muscles"

          "שחייה – Biceps Wall Stretch": {
                "how": "מניחים יד על קיר מאחור ומסובבים גוף בעדינות עד מתיחה בקדמת הזרוע.",
                "helps": "עוזר לפתוח בייספס וכתף קדמית אחרי שחייה.",
                "source": "Wall Bicep Stretch"
          },
          "שחייה – Child’s Pose Lat Reach": {
                "how": "יושבים לאחור בתנוחת ילד ומוליכים ידיים לצד כדי להדגיש מתיחת רחב גבי.",
                "helps": "עוזר לשחרור גב צדדי וכתפיים.",

          "רכיבה – Couch Stretch": {
                "how": "מניחים ברך ליד קיר או ספסל וכף רגל מאחור לפתיחת קדמת הירך.",

          "רכיבה – Seated Figure-4 Stretch": {

                "helps": "עוזר לשחרור ישבן וירך חיצונית.",
                "source": "Seated Figure Four Stretch for Piriformis"
          },
          "רכיבה – Standing Quad Hip Flexor Stretch": {

                "helps": "עוזר להפחית נוקשות ארבע ראשי ומכופפי ירך.",

          },
          "רכיבה – Hamstring Doorway Stretch": {

          "רכיבה – Calf Wall Stretch": {

          },
          "רכיבה – Thoracic Bench Stretch": {

                "helps": "עוזר להפחית נוקשות גב עליון מתנוחת רכיבה.",
                "source": "The Bench Stretch - The Ultimate Lat and Thoracic Spine Mobility Exercise"
          },
          "ריצה – Front-Foot-Elevated Couch Stretch": {

                "helps": "עוזר לפתוח מכופפי ירך וקדמת ירך לרצים.",
                "source": "Front Foot Elevated Couch Stretch with Forward Lean"
          },
          "ריצה – Banded Hip Flexor Stretch": {
                "how": "מחברים גומייה לירך קדמית ונכנסים למכרע כדי למתוח מכופף ירך.",

                "source": "Banded Hip Flexor Stretch | Movement Demo"
          },
          "ריצה – Active Big Toe Stretch": {
                "how": "מותחים את הבוהן הגדולה לפשיטה ומחזיקים בטווח נוח.",
                "helps": "עוזר לשפר דחיפה וגלגול כף רגל בריצה.",
                "source": "Big toe stretch for running with Dr. Leo Kormanik"
          },
          "ריצה – Half-Kneeling Side Bend": {
                "how": "כורעים על ברך ומטים את הגוף הצידה עם יד מעל הראש.",
                "helps": "עוזר לפתוח צד גוף, ירך וצלעות אחרי ריצה.",
                "source": "Half Kneeling Side Bend Stretch | B3 Physical Therapy"
          },
          "ריצה – Cross-Behind IT Band Stretch": {
                "how": "מצליבים רגל מאחורי הרגל השנייה ומטים גוף לצד למתיחת אזור ירך חיצונית.",
                "helps": "עוזר להפחית נוקשות בצד הירך.",
                "source": "Watch This If YOU Have KNEE PAIN: IT Band Syndrome"
          },
          "ריצה – Soleus Wall Stretch": {
                "how": "נשענים על קיר עם ברך אחורית כפופה ועקב על הרצפה.",
                "helps": "עוזר לשחרור סולאוס ואכילס אחרי ריצה.",
                "source": "Soleus muscle calf wall stretch (knee bent)"
          }
    };

    const publicImages = {
      swim: 'https://commons.wikimedia.org/wiki/Special:FilePath/Competition%20swimming%20pool%20block.jpg',
      bike: 'https://commons.wikimedia.org/wiki/Special:FilePath/Cycling%20kit%20full%20body.jpg',
      run: 'https://commons.wikimedia.org/wiki/Special:FilePath/All-weather%20running%20track.jpg'
    };

    const imageForExercise = (type, sport) => {
      if (sport === 'שחייה') return publicImages.swim;
      if (sport === 'רכיבה') return publicImages.bike;
      if (sport === 'ריצה') return publicImages.run;
      return '';
    };

    const exercises = exerciseRows
      .trim()
      .split('\n')
      .map((row) => {
        const [type, title] = row.split('\t');
        const defaults = categoryDefaults[type];
        const sport = sportFromTitle(title);
        const displayTitle = cleanTitle(title);

        const videoId = youtubeVideos[title];
        const guide = exerciseGuides[title] || {
          how: 'מבצעים לפי ההדגמה בסרטון המקושר.',
          helps: defaults.desc,
          source: displayTitle
        };

        return {
          title,
          displayTitle,
          type,
          sport,
          when: defaults.when,
          timesDay: defaults.timesDay,
          sets: defaults.sets,
          youtube: videoId ? 'https://www.youtube.com/watch?v=' + videoId : youtubeSearchUrl(displayTitle),
          image: videoId ? 'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg' : imageForExercise(type, sport),
          desc: defaults.desc,
          how: guide.how,
          helps: guide.helps,
          source: guide.source
        };
      });

    const typeFilter = document.querySelector('#typeFilter');
    const sportFilter = document.querySelector('#sportFilter');
    const searchInput = document.querySelector('#searchInput');
    const grid = document.querySelector('#exerciseGrid');
    const resultCount = document.querySelector('#resultCount');
    const backToTop = document.querySelector('#backToTop');
    const allTypesValue = 'All';
    const types = [allTypesValue, ...Array.from(new Set(exercises.map((exercise) => exercise.type)))];
    const allSportsValue = 'All';
    const sports = [allSportsValue, 'שחייה', 'רכיבה', 'ריצה', 'כללי'];

    function svgImage(exercise) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
          <rect width="640" height="360" fill="#e9f3f1"/>
          <circle cx="106" cy="93" r="44" fill="#0f766e" opacity=".2"/>
          <path d="M0 278 C120 230 205 320 330 264 C445 212 520 240 640 194 L640 360 L0 360 Z" fill="#b45309" opacity=".2"/>
          <text x="48" y="170" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17202a">${exercise.type}</text>
          <text x="48" y="216" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5f6f7b">${exercise.sport}</text>
        </svg>`;

      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function option(value, label) {
      const item = document.createElement('option');
      item.value = value;
      item.textContent = label;
      return item;
    }

    function render() {
      const selectedType = typeFilter.value;
      const selectedSport = sportFilter.value;
      const query = searchInput.value.trim().toLowerCase();
      const visible = exercises.filter((exercise) => {
        const matchesType = selectedType === allTypesValue || exercise.type === selectedType;
        const matchesSport = selectedSport === allSportsValue || exercise.sport === selectedSport;
        const searchable = [
          exercise.title,
          exercise.displayTitle,
          exercise.type,
          exercise.sport,
          exercise.desc,
          exercise.how,
          exercise.helps
        ].join(' ').toLowerCase();
        const matchesSearch = query === '' || searchable.includes(query);
        return matchesType && matchesSport && matchesSearch;
      });

      grid.innerHTML = '';
      resultCount.textContent = `${visible.length} תרגילים`;

      visible.forEach((exercise) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <img src="${exercise.image || svgImage(exercise)}" alt="${exercise.title}">
          <div class="card-body">
            <div class="topline">
              <span class="pill">${exercise.type}</span>
              <span class="pill sport">${exercise.sport}</span>
            </div>
            <h2>${exercise.title}</h2>
            <p class="desc">${exercise.desc}</p>
            <div class="guide-lines">
              <p><strong>מה עושים:</strong> ${exercise.how}</p>
              <p><strong>עוזר ל:</strong> ${exercise.helps}</p>
            </div>
            <dl>
              <dt>פעמים ביום</dt>
              <dd>${exercise.timesDay}</dd>
              <dt>סטים</dt>
              <dd>${exercise.sets}</dd>
              <dt>מתי</dt>
              <dd>${exercise.when}</dd>
            </dl>
            <a href="${exercise.youtube}" target="_blank" rel="noopener">פתח YouTube</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    types.forEach((type) => typeFilter.appendChild(option(type, type === allTypesValue ? 'הכל' : type)));
    sports.forEach((sport) => sportFilter.appendChild(option(sport, sport === allSportsValue ? 'הכל' : sport)));
    typeFilter.addEventListener('change', render);
    sportFilter.addEventListener('change', render);
    searchInput.addEventListener('input', render);
    window.addEventListener('scroll', () => {
      backToTop.classList.toggle('visible', window.scrollY > 360);
    });
    backToTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    render();
  </script>
</body>
</html>
